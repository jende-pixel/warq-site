<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARQ STRESS - Dashboard</title>
    <style>
        :root {
            --bg-color: #0d080f; 
            --panel-bg: #160f1c; 
            --accent-purple: #8a2be2; 
            --accent-red: #ff2a5f; 
            --text-color: #f1ecf5;
            --input-bg: #22172a;
            --border-color: #32223f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Şifre Giriş Ekranı */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(255, 42, 95, 0.1);
            width: 100%;
            max-width: 400px;
        }

        /* Üst Başlık Şeridi */
        .panel-header {
            width: 100%;
            max-width: 1200px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .panel-title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--accent-red), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Katman Seçim Sekmeleri (Tabs) */
        .tab-container {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #bfaec9;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
        }

        /* Ana İçerik Yapısı */
        .dashboard-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            box-sizing: border-box;
        }

        .control-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.05);
        }

        .status-panel {
            flex: 1.5;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .layer-section {
            display: none;
        }

        .layer-section.active {
            display: block;
        }

        h3 {
            margin-top: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-red);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #bfaec9;
        }

        input[type="text"], input[type="number"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.4);
        }

        .attack-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-purple));
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .attack-btn:hover {
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.5);
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 15px;
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th { color: #bfaec9; font-weight: 600; }
        .no-data { text-align: center; color: #665274; padding: 40px; font-style: italic; }
        
        .countdown-badge {
            background: rgba(255, 42, 95, 0.15);
            color: var(--accent-red);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid rgba(255, 42, 95, 0.3);
        }

        .status-running { color: #33ff99; font-weight: bold; }
    </style>
</head>
<body>

<!-- ŞİFRE EKRANI -->
<div id="login-screen">
    <div class="login-box">
        <h2 style="color: var(--accent-red); margin-top:0;">WARQ PANEL LOGIN</h2>
        <p style="color: #bfaec9; font-size: 0.9rem;">Devam etmek için şifreyi giriniz</p>
        <div class="form-group" style="margin-top: 25px;">
            <input type="password" id="panel-password" placeholder="••••••••" style="text-align: center;">
        </div>
        <button class="attack-btn" onclick="checkPassword()">GİRİŞ YAP</button>
        <p id="login-error" style="color: var(--accent-red); margin-top: 15px; display: none; font-size: 0.9rem;">❌ Hatalı Şifre!</p>
    </div>
</div>

<!-- ÜST BAŞLIK ALANI -->
<div class="panel-header">
    <div class="panel-title">WARQ ATTACK PANEL</div>
    <div class="tab-container">
        <button class="tab-btn active" onclick="switchLayer('l7')">Layer 7</button>
        <button class="tab-btn" onclick="switchLayer('l4')">Layer 4</button>
    </div>
</div>

<!-- ANA PANEL ALANI -->
<div class="dashboard-container">
    
    <!-- SOL PANEL: AYARLAR -->
    <div class="control-panel">
        
        <!-- LAYER 7 FORMU -->
        <div id="l7-section" class="layer-section active">
            <h3>⚔️ LAYER 7 SETTINGS</h3>
            <div class="form-group">
                <label>Target (Hedef Alan Adı/URL)</label>
                <input type="text" id="l7-host" placeholder="https://example.com" value="https://domain.com">
            </div>
            <div class="form-group">
                <label>Attack Method</label>
                <select id="l7-method">
                    <option value="WARQ MAX">WARQ MAX</option>
                    <option value="WARQ-BROWSER">WARQ-BROWSER</option>
                    <option value="HTTP BYPASS">HTTP BYPASS</option>
                    <option value="HTTPS BYPASS">HTTPS BYPASS</option>
                    <option value="AKAMAI BYPASS">AKAMAI BYPASS</option>
                    <option value="CLOUDFLARE BYPASS">CLOUDFLARE BYPASS</option>
                    <option value="CF-UAM BYPASS">CF-UAM BYPASS</option>
                    <option value="AWS BYPASS">AWS BYPASS</option>
                    <option value="TLS BYPASS">TLS BYPASS</option>
                    <option value="FASTLY BYPASS">FASTLY BYPASS</option>
                    <option value="WARQ-GET">WARQ-GET</option>
                    <option value="WARQ-POST">WARQ-POST</option>
                </select>
            </div>
            <div class="form-group">
                <label>Time (Süre - Saniye)</label>
                <input type="number" id="l7-time" value="150" min="10" max="3600">
            </div>
            <button class="attack-btn" onclick="launchAttack('l7')">ATTACK (L7)</button>
        </div>

        <!-- LAYER 4 FORMU -->
        <div id="l4-section" class="layer-section">
            <h3>⚔️ LAYER 4 SETTINGS</h3>
            <div class="form-group">
                <label>IP Address</label>
                <input type="text" id="l4-ip" placeholder="192.168.1.1" value="1.1.1.1">
            </div>
            <div class="form-group">
                <label>Port</label>
                <input type="text" id="l4-port" placeholder="1-65535" value="80">
            </div>
            <div class="form-group">
                <label>Attack Method</label>
                <select id="l4-method">
                    <option value="UDP-POWER">UDP-POWER | UDP POWER (Powerful)</option>
                    <option value="UDP-ENET">UDP-ENET | UDP flood with ENet protocol</option>
                    <option value="UDP-PPS">UDP-PPS | UDP flood with random packets</option>
                    <option value="TCP-BGP">TCP-BGP | BGP (TCP flood with BGP protocol)</option>
                    <option value="TCP-SYN">TCP-SYN | SYN (TCP SYN, high PPS)</option>
                    <option value="TCP-LDAP">TCP-LDAP | LDAP (TCP flood with LDAP protocol)</option>
                    <option value="TCP-MYSQL">TCP-MYSQL | MySQL (TCP flood with MySQL protocol)</option>
                    <option value="TCP-IRC">TCP-IRC | IRC (TCP flood with IRC protocol)</option>
                    <option value="DISCORD">DISCORD | (Bypass Discord Call)</option>
                    <option value="AMPLIFICATION">AMPLIFICATION | (AMP)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Time (Süre - Saniye)</label>
                <input type="number" id="l4-time" value="150" min="10" max="3600">
            </div>
            <button class="attack-btn" onclick="launchAttack('l4')">ATTACK (L4)</button>
        </div>

    </div>

    <!-- SAĞ PANEL: CANLI TAKİP TABLOSU -->
    <div class="status-panel">
        <h3>📊 LIVE MONITORING</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Target / IP</th>
                        <th>Method</th>
                        <th>Time Left</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="attack-table-body">
                    <tr id="no-data-row">
                        <td colspan="4" class="no-data">No data. Start attack please</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
// Şifre Doğrulama Fonksiyonu
function checkPassword() {
    const entered = document.getElementById('panel-password').value;
    if (entered === "anixwarq123") {
        document.getElementById('login-screen').style.display = 'none';
    } else {
        document.getElementById('login-error').style.display = 'block';
    }
}

// L4 ve L7 Sekme Geçişi
function switchLayer(layer) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.layer-section').forEach(sec => sec.classList.remove('active'));
    
    if(layer === 'l7') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('l7-section').classList.add('active');
    } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('l4-section').classList.add('active');
    }
}

// Testi Başlatma Mekanizması
function launchAttack(layer) {
    let target = "", method = "", timeLeft = 0;

    if (layer === 'l7') {
        target = document.getElementById('l7-host').value.trim();
        method = document.getElementById('l7-method').value;
        timeLeft = parseInt(document.getElementById('l7-time').value);
        if (!target || target === "https://domain.com") { alert("Geçerli URL girin!"); return; }
    } else {
        const ip = document.getElementById('l4-ip').value.trim();
        const port = document.getElementById('l4-port').value.trim();
        target = ip + ":" + port;
        method = document.getElementById('l4-method').value;
        timeLeft = parseInt(document.getElementById('l4-time').value);
        if (!ip || !port) { alert("IP ve Port girin!"); return; }
    }

    if (isNaN(timeLeft) || timeLeft <= 0) { alert("Geçerli süre girin!"); return; }

    const noDataRow = document.getElementById('no-data-row');
    if (noDataRow) { noDataRow.remove(); }

    const tbody = document.getElementById('attack-table-body');
    const rowId = 'row-' + Date.now();
    const countdownId = 'counter-' + Date.now();

    const newRow = document.createElement('tr');
    newRow.id = rowId;
    newRow.innerHTML = `
        <td style="color: #fff; word-break: break-all;">${target}</td>
        <td style="color: var(--accent-purple); font-weight: bold;">${method}</td>
        <td><span class="countdown-badge" id="${countdownId}">${timeLeft}s</span></td>
        <td class="status-running">Running...</td>
    `;
    tbody.insertBefore(newRow, tbody.firstChild);

    // Arka Plan İsteği (Workers Köprüsü)
    fetch('/attack', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ layer, target, method, time: timeLeft })
    }).catch(err => console.log("Workers İletişim Hatası"));

    // Zamanlayıcı (Geri Sayım)
    const interval = setInterval(() => {
        timeLeft--;
        const counterEl = document.getElementById(countdownId);
        if (counterEl) counterEl.innerText = timeLeft + 's';

        if (timeLeft <= 0) {
            clearInterval(interval);
            const targetRow = document.getElementById(rowId);
            if (targetRow) {
                targetRow.querySelector('.status-running').style.color = '#666';
                targetRow.querySelector('.status-running').innerText = 'Finished';
                targetRow.querySelector('.countdown-badge').style.background = '#222';
                targetRow.querySelector('.countdown-badge').style.color = '#666';
                targetRow.querySelector('.countdown-badge').style.borderColor = '#333';
            }
        }
    }, 1000);
}
</script>
</body>
</html>
